<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZMK hub display</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23161616'/%3E%3Cg fill='%23DE886D'%3E%3Crect x='3' y='4' width='10' height='5'/%3E%3Crect x='1' y='6' width='14' height='2'/%3E%3Crect x='4' y='9' width='1' height='3'/%3E%3Crect x='6' y='9' width='1' height='3'/%3E%3Crect x='9' y='9' width='1' height='3'/%3E%3Crect x='11' y='9' width='1' height='3'/%3E%3C/g%3E%3Crect x='5' y='5' width='1' height='2' fill='%23161616'/%3E%3Crect x='10' y='5' width='1' height='2' fill='%23161616'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #121214; --side: #17171a; --card: #1c1c20; --raised: #26262b; --line: #2b2b31; --line-soft: #232328;
  --text: #ededf0; --muted: #a0a0a8; --faint: #6e6e77;
  --accent: #de886d; --accent-ink: #2b130b; --accent-soft: rgba(222, 136, 109, .15);
  --ok: #6fcf97;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  display: grid; grid-template-columns: 248px minmax(0, 1fr); overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { width: 18px; height: 18px; flex: none; }

/* ---- sidebar: overview, one entry per screen, app ---- */
nav { background: var(--side); border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 12px; font-weight: 600; letter-spacing: .01em; }
.brand svg { width: 22px; height: 22px; }
.groups { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
.group { margin-top: 18px; }
.group:first-child { margin-top: 6px; }
.group-title { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 0 10px 6px; }
.item { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 2px 12px; width: 100%;
  padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: var(--muted); text-align: left; cursor: pointer;
  transition: background-color .15s, color .15s; }
.item:hover { background: var(--raised); color: var(--text); }
.item[aria-current="page"] { background: var(--raised); color: var(--text); }
.item[aria-current="page"] .ico { color: var(--accent); }
.item .name { font-weight: 500; }
.item .sub { grid-column: 2 / 4; font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -2px; }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(111, 207, 151, .15); }
.mini { padding: 14px 16px 18px; border-top: 1px solid var(--line-soft); }
.mini.hidden { display: none; }

/* ---- the hub picture ---- */
.hub { background: #070707; border: 1px solid var(--line); border-radius: 12px; padding: 8px; position: relative; }
.hub img { display: block; width: 100%; aspect-ratio: 320 / 170; image-rendering: pixelated; border-radius: 4px; background: #000; transition: opacity .3s; }
.hub.off img { opacity: .3; }
.hub .off-note { position: absolute; inset: 0; display: none; place-items: center; color: var(--muted); font-size: 13px; }
.hub.off .off-note { display: grid; }
.status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; margin-top: 10px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.on { background: var(--ok); }

/* ---- page ---- */
main { overflow-y: auto; }
.page { max-width: 700px; margin: 0 auto; padding: 40px 48px 64px; }
header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
.badge-ico { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.badge-ico .ico { width: 22px; height: 22px; }
header h1 { font-size: 24px; font-weight: 600; margin: 0; line-height: 1.2; }
header p { margin: 2px 0 0; color: var(--muted); }
header .grow { flex: 1; min-width: 0; }
.hero { margin: 0 auto 32px; max-width: 460px; }
.hero .status { justify-content: center; }
.hero .hub { padding: 10px; }

section { margin-top: 28px; }
section:first-of-type { margin-top: 0; }
h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 10px 4px; }
.card { background: var(--card); border: 1px solid var(--line-soft); border-radius: 12px; }
.row { display: flex; align-items: center; gap: 24px; padding: 16px 18px; }
.row + .row { border-top: 1px solid var(--line-soft); }
.row .text { flex: 1; min-width: 0; }
.row .label { font-weight: 500; }
.row .help { color: var(--muted); font-size: 13px; margin-top: 2px; }
.row.wide { flex-direction: column; align-items: stretch; gap: 12px; }
.row .value { color: var(--muted); font-size: 13px; text-align: right; max-width: 60%; overflow-wrap: anywhere; }

/* screens list on the overview */
.screen-row { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; transition: background-color .15s; }
.screen-row:hover { background: var(--raised); }
.screen-row:first-child { border-radius: 12px 12px 0 0; }
.screen-row:last-child { border-radius: 0 0 12px 12px; }
.screen-row:only-child { border-radius: 12px; }
.screen-row .ico { color: var(--muted); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--raised); color: var(--muted); white-space: nowrap; }
.tag.accent { background: var(--accent-soft); color: var(--accent); }
.chev { color: var(--faint); }

/* controls */
.switch { width: 42px; height: 24px; border-radius: 12px; border: 0; background: #3b3b42; position: relative; cursor: pointer; transition: background-color .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s cubic-bezier(.22, 1, .36, 1); }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.segmented { display: inline-flex; background: var(--bg); border: 1px solid var(--line-soft); border-radius: 9px; padding: 3px; gap: 2px; flex: none; }
.segmented button { border: 0; background: none; color: var(--muted); padding: 5px 14px; border-radius: 6px; cursor: pointer; transition: background-color .15s, color .15s; }
.segmented button:hover { color: var(--text); }
.segmented button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: none; color: var(--muted); padding: 5px 12px; border-radius: 999px; cursor: pointer; transition: border-color .15s, color .15s, background-color .15s; }
.chip:hover { color: var(--text); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.range { display: flex; align-items: center; gap: 12px; width: 240px; flex: none; }
.range output { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { flex: 1; accent-color: var(--accent); }
input[type=text], select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 220px; transition: border-color .15s; }
input[type=text]:focus, select:focus { border-color: var(--accent); outline: none; }
.btn { border: 1px solid var(--line); background: var(--raised); padding: 7px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; transition: border-color .15s, background-color .15s; flex: none; }
.btn:hover { border-color: var(--faint); }
.btn.ghost { background: none; display: inline-flex; align-items: center; gap: 8px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); opacity: 0; background: var(--raised); border: 1px solid var(--line);
  padding: 10px 16px; border-radius: 10px; max-width: min(640px, 90vw); transition: opacity .2s, transform .2s cubic-bezier(.22, 1, .36, 1); pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.gone { position: fixed; inset: 0; display: none; place-items: center; background: rgba(12, 12, 12, .9); color: var(--muted); text-align: center; padding: 24px; }
.gone.show { display: grid; }

@media (max-width: 760px) {
  body { grid-template-columns: 72px minmax(0, 1fr); }
  .brand span, .group-title, .item .name, .item .sub, .live, .mini { display: none; }
  .brand { justify-content: center; padding: 18px 0 8px; }
  .item { grid-template-columns: 18px; justify-content: center; padding: 10px; }
  .page { padding: 28px 20px 48px; }
  .row { flex-wrap: wrap; }
  .range, input[type=text] { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<nav aria-label="Settings">
  <div class="brand"><svg viewBox="0 0 16 16" aria-hidden="true"><g fill="#DE886D"><rect x="3" y="4" width="10" height="5"/><rect x="1" y="6" width="14" height="2"/><rect x="4" y="9" width="1" height="3"/><rect x="6" y="9" width="1" height="3"/><rect x="9" y="9" width="1" height="3"/><rect x="11" y="9" width="1" height="3"/></g><rect x="5" y="5" width="1" height="2" fill="#17171a"/><rect x="10" y="5" width="1" height="2" fill="#17171a"/></svg><span>Hub display</span></div>
  <div class="groups" id="groups"></div>
  <div class="mini" id="mini"></div>
</nav>
<main id="main"></main>
<div id="toast" class="toast" role="status"></div>
<div id="gone" class="gone">The app restarted or quit.<br>Open this window again from the tray icon.</div>

<script>
"use strict";
const token = new URLSearchParams(location.search).get("t") || "";
const $ = id => document.getElementById(id);
const el = (tag, props, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) e.append(kid);
  return e;
};

const icons = {
  hub: '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',
  keyboard: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
  claude: '<path d="M6 8h12v6H6zM3 11h3M18 11h3M8 14v3M11 14v3M13 14v3M16 14v3"/><path d="M9 10v1M15 10v1"/>',
  app: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  chevron: '<path d="m9 6 6 6-6 6"/>',
  default: '<rect x="4" y="4" width="16" height="16" rx="3"/>'
};
const icon = name => {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "ico"); s.setAttribute("aria-hidden", "true");
  s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "1.8");
  s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
  s.innerHTML = icons[name] || icons.default;
  return s;
};

const groupTitles = { hub: "Hub", screens: "Screens", app: "App" };
let model = null;
let current = (() => { try { return localStorage.getItem("page") || "hub"; } catch { return "hub"; } })();
let busy = false; // a text box or slider is in use: do not redraw under it

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: Object.assign({ "X-Hub-Token": token }, body ? { "Content-Type": "application/json" } : {}),
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 403) { $("gone").classList.add("show"); throw new Error("expired"); }
  if (!res.ok) throw new Error(res.status + "");
  return res.json();
}

let toastTimer;
function toast(text) {
  if (!text) return;
  $("toast").textContent = text;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 4000);
}

async function set(page, key, value) {
  try { model = await api("/api/set", { page, key, value }); render(); }
  catch (e) { if (e.message !== "expired") toast("Could not save (" + e.message + ")"); }
}

async function run(page, key) {
  try { const r = await api("/api/run", { page, key }); model = r.model; render(); toast(r.message); }
  catch (e) { if (e.message !== "expired") toast("Could not run (" + e.message + ")"); }
}

function preview(screen) {
  const s = model.screens.find(x => x.id === screen);
  api("/api/preview", { screen }).then(() => toast("Showing " + (s ? s.title : screen) + " on the hub for 8 seconds")).catch(() => {});
}

function go(id) {
  current = id;
  try { localStorage.setItem("page", id); } catch {}
  render();
  $("main").scrollTop = 0;
}

// ---- one control per kind of field ----
const controls = {
  toggle: (p, f) => el("button", { class: "switch", role: "switch", "aria-checked": String(!!f.value), "aria-label": f.label,
    onclick: () => set(p, f.key, !f.value) }),
  choice: (p, f) => f.choices.length <= 4
    ? el("div", { class: "segmented", role: "group", "aria-label": f.label },
        f.choices.map(c => el("button", { "aria-pressed": String(c.value === f.value), onclick: () => set(p, f.key, c.value) }, c.label)))
    : el("select", { "aria-label": f.label, onchange: e => set(p, f.key, e.target.value) },
        f.choices.map(c => el("option", { value: c.value, selected: c.value === f.value }, c.label))),
  multi: (p, f) => el("div", { class: "chips", role: "group", "aria-label": f.label },
    f.choices.map(c => {
      const on = (f.value || []).includes(c.value);
      return el("button", { class: "chip", "aria-pressed": String(on),
        onclick: () => set(p, f.key, on ? f.value.filter(v => v !== c.value) : (f.value || []).concat(c.value)) }, c.label);
    })),
  number: (p, f) => {
    const unit = v => v + (f.unit ? " " + f.unit : "");
    const out = el("output", {}, unit(f.value));
    return el("div", { class: "range" },
      el("input", { type: "range", min: f.min, max: f.max, step: f.step, value: f.value, "aria-label": f.label,
        onpointerdown: () => { busy = true; },
        oninput: e => { out.textContent = unit(e.target.value); },
        onchange: e => { busy = false; set(p, f.key, Number(e.target.value)); } }),
      out);
  },
  text: (p, f) => el("input", { type: "text", value: f.value || "", "aria-label": f.label, spellcheck: "false",
    onfocus: () => { busy = true; },
    onblur: e => { busy = false; if (e.target.value !== f.value) set(p, f.key, e.target.value); },
    onkeydown: e => { if (e.key === "Enter") e.target.blur(); if (e.key === "Escape") { e.target.value = f.value || ""; e.target.blur(); } } }),
  button: (p, f) => el("button", { class: "btn", onclick: () => run(p, f.key) }, f.label),
  info: (p, f) => el("div", { class: "value" }, String(f.value ?? ""))
};

function row(page, f) {
  // a button names itself, so its help is the text on the left; a list of chips gets the full width
  const text = f.kind === "button"
    ? el("div", { class: "text" }, el("div", { class: "help" }, f.help))
    : el("div", { class: "text" }, el("div", { class: "label" }, f.label), f.help ? el("div", { class: "help" }, f.help) : null);
  return el("div", { class: "row" + (f.kind === "multi" ? " wide" : "") }, text, (controls[f.kind] || controls.info)(page, f));
}

function sectionBlock(title, ...cards) {
  return el("section", {}, title ? el("h2", {}, title) : null, ...cards);
}

function hubPicture() {
  return el("div", { class: "hub", id: "hubbox" },
    el("img", { id: "frame", alt: "What the hub shows" }),
    el("div", { class: "off-note" }, "Screen off"));
}

function statusLine() {
  const shown = model.screens.find(s => s.id === model.shown);
  return el("div", { class: "status" }, el("span", { class: "dot" + (model.lit ? " on" : "") }),
    el("span", {}, (model.lit ? "On" : "Off") + (shown ? " · showing " + shown.title : "")));
}

function screensCard() {
  return el("div", { class: "card" }, model.screens.map(s =>
    el("button", { class: "row screen-row", onclick: () => go(s.id) },
      icon(s.id),
      el("div", { class: "text" }, el("div", { class: "label" }, s.title), el("div", { class: "help" }, s.summary)),
      el("div", { class: "tags" },
        s.pinned ? el("span", { class: "tag accent" }, "Pinned") : null,
        s.rotation ? el("span", { class: "tag accent" }, "In rotation") : null,
        s.takeover ? el("span", { class: "tag" }, "Takes over") : null,
        s.id === model.shown ? el("span", { class: "tag" }, "On the hub") : null),
      el("span", { class: "chev" }, icon("chevron")))));
}

function render() {
  if (!model) return;
  if (!model.pages.some(p => p.id === current)) current = model.pages[0].id;
  const page = model.pages.find(p => p.id === current);

  // sidebar, grouped
  const groups = [];
  for (const p of model.pages) {
    let g = groups.find(x => x.id === p.group);
    if (!g) groups.push(g = { id: p.group, pages: [] });
    g.pages.push(p);
  }
  $("groups").replaceChildren(...groups.map(g => el("div", { class: "group" },
    el("div", { class: "group-title" }, groupTitles[g.id] || g.id),
    g.pages.map(p => el("button", { class: "item", "aria-current": p.id === current ? "page" : null, onclick: () => go(p.id) },
      icon(p.icon), el("span", { class: "name" }, p.title),
      p.screen && p.screen === model.shown ? el("span", { class: "live", title: "On the hub now" }) : el("span"),
      p.summary ? el("span", { class: "sub" }, p.summary) : null)))));

  // the overview has the big picture; every other page keeps a small one in the sidebar
  const overview = page.id === "hub";
  $("mini").classList.toggle("hidden", overview);
  $("mini").replaceChildren(...(overview ? [] : [hubPicture(), statusLine()]));

  const head = el("header", {},
    el("div", { class: "badge-ico" }, icon(page.icon)),
    el("div", { class: "grow" }, el("h1", {}, page.title), page.summary ? el("p", {}, page.summary) : null),
    page.screen ? el("button", { class: "btn ghost", onclick: () => preview(page.screen) }, icon("eye"), "Show on hub") : null);

  const blocks = page.sections.filter(s => s.fields.length > 0).map(s =>
    sectionBlock(s.title, el("div", { class: "card" }, s.fields.map(f => row(page.id, f)))));
  if (overview) blocks.splice(1, 0, sectionBlock("Screens", screensCard()));

  $("main").replaceChildren(el("div", { class: "page" },
    head,
    overview ? el("div", { class: "hero" }, hubPicture(), statusLine()) : null,
    ...blocks));
  if (lastUrl) $("frame").src = lastUrl;
}

// the hub's picture, a few times a second while the window is visible
let lastUrl = null;
async function frame() {
  if (document.visibilityState === "visible") {
    try {
      const res = await fetch("/api/frame.png", { headers: { "X-Hub-Token": token }, cache: "no-store" });
      if (res.status === 403) { $("gone").classList.add("show"); return; }
      const url = URL.createObjectURL(await res.blob());
      const img = $("frame");
      if (img) img.src = url;
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = url;
      const box = $("hubbox");
      if (box) box.classList.toggle("off", res.headers.get("X-Lit") === "0");
    } catch {}
  }
  setTimeout(frame, 200);
}

async function refresh() {
  if (!busy && document.visibilityState === "visible") {
    try { model = await api("/api/model"); render(); } catch {}
  }
  setTimeout(refresh, 2000);
}

refresh();
frame();
</script>
</body>
</html>
